<!DOCTYPE html>
<html>
<head>
    <title>EEE Books</title>

    <style>
        body { background:#F5EDB8; color:#665018; font-family:Arial; }
        h1, h3 { color:#795500; }
        .book { border:1px solid #B99A45; padding:12px; margin:12px 0; background:#FFF9DE; }
        img { width:90px; height:120px; object-fit:contain; }
        button { background:#795500; color:white; padding:7px 12px; cursor:pointer; }
    </style>
</head>

<body>
    <h1>EEE Book Catalogue</h1>
    <a href="cart.html" target="f3">View Cart</a>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9780470871808-M.jpg"
             alt="Electric Machines book cover">
        <h3>Principles of Electric Machines and Power Electronics</h3>
        <p>Author: P. C. Sen</p>
        <p>Price: ₹850</p>
        <button onclick="addToCart('eee1','Principles of Electric Machines and Power Electronics',850)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9780070699670-M.jpg"
             alt="Power System Engineering cover">
        <h3>Power System Engineering</h3>
        <p>Authors: D. P. Kothari and I. J. Nagrath</p>
        <p>Price: ₹780</p>
        <button onclick="addToCart('eee2','Power System Engineering',780)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9780070648150-M.jpg"
             alt="Basic Electrical Engineering cover">
        <h3>Basic Electrical Engineering</h3>
        <p>Author: D. C. Kulshreshtha</p>
        <p>Price: ₹600</p>
        <button onclick="addToCart('eee3','Basic Electrical Engineering',600)">
            Add to Cart
        </button>
    </div>

    <script src="cart.js"></script>
</body>
</html>
