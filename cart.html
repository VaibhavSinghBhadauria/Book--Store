<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Book Store - Shopping Cart</title>
</head>

<body style="background-color: #DDE8C8;
             font-family: Arial, sans-serif;
             color: #4B3621;
             padding: 15px;">

    <header>
        <h1>Your Shopping Cart</h1>

        <p>
            <a href="catalogue.html" target="f3"
               style="color: #6B2D1A;">
                ← Continue Shopping
            </a>
        </p>
    </header>

    <main>
        <h2>Selected Engineering Books</h2>

        <table border="1" cellpadding="8"
               cellspacing="0" width="100%"
               style="border-collapse: collapse;
                      background-color: white;">

            <caption style="padding: 10px;">
                Books selected from the catalogue
            </caption>

            <thead style="background-color: #FFD6A5;">
                <tr>
                    <th scope="col">Book</th>
                    <th scope="col">Price</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Subtotal</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>

            <tbody id="cartItems">
                <!-- Cart items are added automatically by cart.js -->
            </tbody>

            <tfoot>
                <tr style="background-color: #FFD6A5;">
                    <th scope="row" colspan="3">Grand Total</th>
                    <td colspan="2">
                        <strong id="cartTotal">₹0</strong>
                    </td>
                </tr>
            </tfoot>
        </table>

        <h2>Order Summary</h2>

        <table border="1" cellpadding="8"
               cellspacing="0"
               style="border-collapse: collapse;
                      background-color: white;">

            <tbody>
                <tr>
                    <th scope="row">Total Books</th>
                    <td id="totalBooks">0</td>
                </tr>

                <tr>
                    <th scope="row">Total Amount</th>
                    <td id="summaryTotal">₹0</td>
                </tr>
            </tbody>
        </table>

        <p>
            <button type="button" onclick="clearCart()"
                    style="padding: 8px 12px;
                           cursor: pointer;">
                Clear Cart
            </button>
        </p>

        <p>
            <button type="button"
                    onclick="alert('Checkout functionality is not implemented yet.')"
                    style="padding: 8px 12px;
                           cursor: pointer;">
                Proceed to Checkout
            </button>
        </p>
    </main>

    <script src="cart.js"></script>

    <script>
        // Update the order summary
        function updateOrderSummary() {
            const cart = JSON.parse(
                localStorage.getItem("bookCart")
            ) || [];

            const totalBooks = cart.reduce(
                (sum, book) => sum + book.quantity, 0
            );

            const totalAmount = cart.reduce(
                (sum, book) => sum + book.price * book.quantity, 0
            );

            document.getElementById("totalBooks").textContent =
                totalBooks;

            document.getElementById("summaryTotal").textContent =
                "₹" + totalAmount;
        }

        // Refresh the summary whenever the cart is displayed
        document.addEventListener("DOMContentLoaded", function() {
            updateOrderSummary();

            // Recalculate after cart actions
            const originalDisplayCart = displayCart;

            displayCart = function() {
                originalDisplayCart();
                updateOrderSummary();
            };

            displayCart();
        });
    </script>

</body>
</html>
