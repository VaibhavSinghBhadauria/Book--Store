<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            background: #F5EDB8;
            color: #665018;
            font-family: Arial;
        }

        h1, h2 {
            color: #795500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #FFF9DE;
        }

        th, td {
            border: 1px solid #B99A45;
            padding: 9px;
            text-align: center;
        }

        th {
            background: #E8D98C;
        }

        button {
            background: #795500;
            color: white;
            padding: 5px 8px;
            cursor: pointer;
        }
    </style>
</head>

<body onload="displayCart()">

    <h1>Your Shopping Cart</h1>

    <a href="catalogue.html" target="f3">
        Continue Shopping
    </a>

    <h2>Selected Books</h2>

    <table>
        <thead>
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cartItems">
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Grand Total</th>
                <th colspan="2" id="cartTotal">₹0</th>
            </tr>
        </tfoot>
    </table>

    <h2>Order Summary</h2>

    <p>Total Books: <strong id="totalBooks">0</strong></p>

    <p>Total Amount: <strong id="summaryTotal">₹0</strong></p>

    <button onclick="clearCart()">Clear Cart</button>

    <button onclick="checkout()">Proceed to Checkout</button>

    <p id="message"></p>

    <script src="cart.js"></script>

    <script>
        function checkout() {
            let cart = getCart();
            let message = document.getElementById("message");

            if (cart.length === 0) {
                message.innerText = "Please add books before checkout.";
                return;
            }

            message.innerText =
                "Demo checkout only. No payment has been processed.";
        }
    </script>

</body>
</html>
