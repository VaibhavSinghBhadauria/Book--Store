<!DOCTYPE html>
<html>
<head>
    <title>CSE Books</title>

    <style>
        body {
            background: #F5EDB8;
            color: #665018;
            font-family: Arial;
        }

        h1, h3 {
            color: #795500;
        }

        .book {
            border: 1px solid #B99A45;
            padding: 12px;
            margin: 12px 0;
            background: #FFF9DE;
        }

        img {
            width: 90px;
            height: 120px;
            object-fit: contain;
        }

        button {
            background: #795500;
            color: white;
            padding: 7px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>CSE Book Catalogue</h1>
    <a href="cart.html" target="f3">View Cart</a>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9788183331630-M.jpg"
             alt="Let Us C book cover">
        <h3>Let Us C</h3>
        <p>Author: Yashavant Kanetkar</p>
        <p>Price: ₹450</p>
        <button onclick="addToCart('cse1','Let Us C',450)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9780132350884-M.jpg"
             alt="Clean Code book cover">
        <h3>Clean Code</h3>
        <p>Author: Robert C. Martin</p>
        <p>Price: ₹650</p>
        <button onclick="addToCart('cse2','Clean Code',650)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9780262046305-M.jpg"
             alt="Introduction to Algorithms book cover">
        <h3>Introduction to Algorithms</h3>
        <p>Author: Thomas H. Cormen and others</p>
        <p>Price: ₹950</p>
        <button onclick="addToCart('cse3','Introduction to Algorithms',950)">
            Add to Cart
        </button>
    </div>

    <script src="cart.js"></script>
</body>
</html>
