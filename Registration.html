</head>
   
<body bgcolor=" yellow "> 
    <center >
    <font color =" blue ">
  <h1><strong>Registration Form</strong></h1> <br>
  <form>
    
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>

    
    <label for="password">Password:</label>
    <input type="password" id="password" name="password"><br><br>

    
    <label for="email">E-mail ID:</label>
    <input type="text" id="email" name="email"><br><br>

    
    <label for="phone">Phone Number:</label>
    <input type="text" id="phone" name="phone"><br><br>

   
    <label>Sex:</label>
    <input type="radio" id="male" name="sex" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="sex" value="Female">
    <label for="female">Female</label><br><br>

    
    <label>Date of Birth:</label>
    <select name="day">
      <option value="">Day</option>
      <option>1</option><option>2</option><option>3</option><option>4</option>
      <option>5</option><option>6</option><option>7</option><option>8</option>
      <option>9</option><option>10</option><option>11</option><option>12</option>
      <option>13</option><option>14</option><option>15</option><option>16</option>
      <option>17</option><option>18</option><option>19</option><option>20</option>
      <option>21</option><option>22</option><option>23</option><option>24</option>
      <option>25</option><option>26 </option><Option>27</Option>
      <Option>28</Option>
      <Option>29</Option>
      <Option>30</Option>
      <Option>31</Option>
    </select>
    <select name="month">
      <option value="">Month</option>
      <option>January</option><option>February</option><option>March</option>
      <option>April</option><option>May</option><option>June</option>
      <option>July</option><option>August</option><option>September</option>
      <option>October</option><option>November</option><option>December</option>
    </select>
    <select name="year">
      <option value="">Year</option>
      <option>2000</option><option>2001</option><option>2002</option><option>2003</option>
      <option>2004</option><option>2005</option><option>2006</option><option>2007</option>
    </select><br><br>

    
    <label>Languages Known:</label>
    <input type="checkbox" id="english" name="languages" value="English">
    <label for="english">English</label>
    <input type="checkbox" id="telugu" name="languages" value="Telugu">
    <label for="telugu">Telugu</label>
    <input type="checkbox" id="hindi" name="languages" value="Hindi">
    <label for="hindi">Hindi</label>
    <input type="checkbox" id="tamil" name="languages" value="Tamil">
    <label for="tamil">Tamil</label><br><br>

 
    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="40"></textarea><br><br>

    
    <input type="submit" value="Register">
  </form>

    </font>
    </center>
</body>
</html>
