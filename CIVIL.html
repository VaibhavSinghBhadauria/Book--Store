<!DOCTYPE html>
<html>
<head>
    <title>CIVIL Books</title>

    <style>
        body { background:#F5EDB8; color:#665018; font-family:Arial; }
        h1, h3 { color:#795500; }
        .book { border:1px solid #B99A45; padding:12px; margin:12px 0; background:#FFF9DE; }
        img { width:90px; height:120px; object-fit:contain; }
        button { background:#795500; color:white; padding:7px 12px; cursor:pointer; }
    </style>
</head>

<body>
    <h1>CIVIL Book Catalogue</h1>
    <a href="cart.html" target="f3">View Cart</a>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9788121926164-M.jpg"
             alt="Engineering Mechanics cover">
        <h3>A Textbook of Engineering Mechanics</h3>
        <p>Author: R. S. Khurmi</p>
        <p>Price: ₹550</p>
        <button onclick="addToCart('civil1','A Textbook of Engineering Mechanics',550)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9788121908160-M.jpg"
             alt="Strength of Materials cover">
        <h3>Strength of Materials</h3>
        <p>Authors: R. S. Khurmi and N. Khurmi</p>
        <p>Price: ₹650</p>
        <button onclick="addToCart('civil2','Strength of Materials',650)">
            Add to Cart
        </button>
    </div>

    <div class="book">
        <img src="https://covers.openlibrary.org/b/isbn/9788170088530-M.jpg"
             alt="Surveying book cover">
        <h3>Surveying Vol. 1</h3>
        <p>Authors: B. C. Punmia and others</p>
        <p>Price: ₹700</p>
        <button onclick="addToCart('civil3','Surveying Vol. 1',700)">
            Add to Cart
        </button>
    </div>

    <script src="cart.js"></script>
</body>
</html>
